name: Pill Point Delivery - Automated Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests-and-build:
    name: Run unit tests and build APK
    runs-on: ubuntu-latest

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Enable Gradle wrapper
    run: chmod +x gradlew

  - name: Restore Firebase configuration
    env:
      FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
    run: |
      if [ -z "$FIREBASE_CONFIG_BASE64" ]; then
        echo "Missing FIREBASE_CONFIG_BASE64 secret"
        exit 1
      fi
      printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json

  - name: Run all local unit tests
    run: ./gradlew testDebugUnitTest

  - name: Build debug APK
    run: ./gradlew assembleDebug

  - name: Upload unit-test reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: unit-test-reports
      path: app/build/reports/tests/
      if-no-files-found: warn

  - name: Upload debug APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: pill-point-delivery-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
